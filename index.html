<title>Ada's Nesting Boxes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Space+Mono:wght@400;700&display=swap">

<style>
:root{
  --sky:#EDE6FA;  --sky2:#F8F4FF;  --panel:#FFFFFF;  --panel2:#F4EFFD;
  --ink:#2A1D4E;  --muted:#6D5E92; --line:#DCD2F0;   --line2:#EBE4F8;

  --ai:#0E8C82;   --ml:#C4611F;    --dl:#4356C9;     --gen:#E8760C;
  --ai-fill:#DCF1EE; --ml-fill:#FAE6D6; --dl-fill:#E1E5FA; --gen-fill:#FCEBD2;

  --joy:#E8459B;  --good:#16916A;  --good-fill:#DAF0E6;
  --oops:#D2603C; --oops-fill:#FBE6DE;

  --shadow:0 2px 4px rgba(42,29,78,.06), 0 14px 34px -16px rgba(42,29,78,.34);
  --pop:0 3px 0 rgba(42,29,78,.16);
  --band:56px; --radius:24px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#16102B; --sky2:#1E1638; --panel:#241B44; --panel2:#2C2153;
    --ink:#F0EAFF; --muted:#A99BD0; --line:#3B2E68; --line2:#31265A;

    --ai:#45D6C4; --ml:#F09A4A; --dl:#93A4FF; --gen:#FFA83D;
    --ai-fill:#123A38; --ml-fill:#3A2415; --dl-fill:#1F2450; --gen-fill:#3D2810;

    --joy:#FF7ABF; --good:#4FD9A0; --good-fill:#123B30;
    --oops:#FF8B72; --oops-fill:#3A211A;

    --shadow:0 2px 4px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.8);
    --pop:0 3px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --sky:#16102B; --sky2:#1E1638; --panel:#241B44; --panel2:#2C2153;
  --ink:#F0EAFF; --muted:#A99BD0; --line:#3B2E68; --line2:#31265A;

  --ai:#45D6C4; --ml:#F09A4A; --dl:#93A4FF; --gen:#FFA83D;
  --ai-fill:#123A38; --ml-fill:#3A2415; --dl-fill:#1F2450; --gen-fill:#3D2810;

  --joy:#FF7ABF; --good:#4FD9A0; --good-fill:#123B30;
  --oops:#FF8B72; --oops-fill:#3A211A;

  --shadow:0 2px 4px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.8);
  --pop:0 3px 0 rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  background:var(--sky);
  color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
button{font:inherit;color:inherit}
:where(button,[tabindex]):focus-visible{outline:3px solid var(--joy);outline-offset:3px;border-radius:8px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

.shell{max-width:1020px;margin-inline:auto;padding:16px 18px 60px;display:flex;flex-direction:column;gap:18px}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.15rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:99px;background:var(--joy);box-shadow:0 0 0 4px color-mix(in srgb,var(--joy) 24%,transparent)}
.chip{
  font-family:"Space Mono",ui-monospace,monospace;font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;padding:5px 11px;border-radius:99px;background:var(--panel);border:2px solid var(--line);white-space:nowrap;
}
.chip[data-lv="1"]{border-color:var(--ai);color:var(--ai)}
.chip[data-lv="2"]{border-color:var(--ml);color:var(--ml)}
.chip[data-lv="3"]{border-color:var(--gen);color:var(--gen)}
.stars{color:var(--joy);display:flex;gap:3px;align-items:center;font-size:.95rem;letter-spacing:1px}
.score{font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--ink);font-size:.92rem}
.vbtn{
  border:2px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;cursor:pointer;
  font-family:"Space Mono",monospace;font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.vbtn[data-on]{border-color:var(--joy);color:var(--joy)}

/* ---------- generic ---------- */
.eyebrow{font-family:"Space Mono",monospace;font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.lede{max-width:62ch;color:var(--muted);font-size:1.02rem}
.view{display:flex;flex-direction:column;gap:18px;min-height:58vh}
h1.title{font-size:clamp(1.9rem,5vw,2.9rem)}
h2.title{font-size:clamp(1.35rem,3.2vw,2rem)}
.row{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.counter{font-family:"Space Mono",monospace;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

.btn{
  border:none;background:var(--ink);color:var(--sky);border-radius:99px;padding:12px 26px;
  font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1rem;cursor:pointer;
  box-shadow:var(--pop);transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(42,29,78,.18)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(42,29,78,.18)}
.btn.joy{background:var(--joy);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none}

/* ---------- puppet / lipsync ---------- */
.speak{
  display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:end;
  background:var(--panel);border:2px solid var(--line2);border-radius:22px;padding:16px;box-shadow:var(--shadow);
}
.puppet{position:relative;width:100%;aspect-ratio:1;align-self:end}
.puppet .bob{position:absolute;inset:0;transform-origin:50% 90%}
.puppet[data-talking] .bob{animation:talkbob .5s ease-in-out infinite}
@keyframes talkbob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2.5%) rotate(-1.1deg)}}
.puppet .face{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center bottom}
.puppet .mouth{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.puppet .ring{
  position:absolute;inset:-6% -6% -2% -6%;border-radius:50%;
  background:radial-gradient(circle at 50% 60%, color-mix(in srgb,var(--hue) 22%,transparent), transparent 68%);
  opacity:0;transition:opacity .3s;
}
.puppet[data-talking] .ring{opacity:1}

.bubbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.who{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--hue)}
.bubble{
  position:relative;background:var(--panel2);border:2px solid var(--line2);border-radius:18px 18px 18px 5px;
  padding:14px 16px;font-size:1.02rem;line-height:1.55;min-height:76px;
}
.bubble .caret{display:inline-block;width:9px;height:1.05em;vertical-align:-.18em;background:var(--hue);border-radius:2px;animation:blink .7s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.skip{align-self:flex-start;font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 0}
.skip:hover{color:var(--ink)}

/* ---------- meet grid ---------- */
.meet{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.meetcard{
  background:var(--panel);border:2px solid var(--line2);border-radius:20px;padding:12px 10px 14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  transition:transform .14s, border-color .2s, box-shadow .2s;border-bottom:5px solid var(--hue);
}
.meetcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.meetcard .hero{width:100%;height:118px;background-size:contain;background-repeat:no-repeat;background-position:center bottom}
.meetcard .nm{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.02rem}
.meetcard .rl{font-family:"Space Mono",monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--hue);font-weight:700}
.meetcard .tick{font-size:.72rem;color:var(--good);font-weight:700;opacity:0;transition:opacity .3s}
.meetcard[data-heard] .tick{opacity:1}
.meetcard[data-heard]{border-color:var(--hue)}

/* ---------- nesting rings ---------- */
.rings{position:relative;width:min(100%,600px);aspect-ratio:6/5;margin-inline:auto}
.ringb{
  position:absolute;border:3px solid var(--hue);border-radius:var(--radius);background:var(--fill);
  display:flex;flex-direction:column;align-items:center;padding-top:9px;cursor:pointer;
  transition:transform .15s, box-shadow .2s, filter .25s;
}
.b-ai {inset:0;                   z-index:1;--hue:var(--ai); --fill:var(--ai-fill)}
.b-ml {inset:var(--band);         z-index:2;--hue:var(--ml); --fill:var(--ml-fill)}
.b-dl {inset:calc(var(--band)*2); z-index:3;--hue:var(--dl); --fill:var(--dl-fill)}
.b-gen{inset:calc(var(--band)*3); z-index:4;--hue:var(--gen);--fill:var(--gen-fill)}
.rings[data-live] .ringb:hover{transform:scale(1.014);box-shadow:0 12px 30px -12px color-mix(in srgb,var(--hue) 70%,transparent)}
.rings:not([data-live]) .ringb{pointer-events:none;cursor:default}
.rtag{
  display:flex;align-items:center;gap:7px;font-family:"Space Mono",monospace;font-size:.64rem;
  letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--hue);white-space:nowrap;
}
.rtag .av{width:32px;height:32px;background-size:contain;background-repeat:no-repeat;background-position:center bottom;flex:none}
.ringb[data-state="right"]{box-shadow:0 0 0 5px var(--good)}
.ringb[data-state="wrong"]{box-shadow:0 0 0 5px var(--oops);animation:shake .4s}
.ringb[data-dim]{filter:saturate(.2) opacity(.5)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rcore{margin:auto;font-family:"Space Mono",monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gen);text-align:center;padding:0 10px;opacity:.8}

/* ---------- cards / choices ---------- */
.qcard{
  background:var(--panel);border:2px solid var(--line2);border-left:6px solid var(--joy);border-radius:16px;
  padding:15px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;
}
.qcard .qn{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.18rem}
.qcard .qd{color:var(--muted);font-size:.96rem}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.choices.four{grid-template-columns:repeat(4,1fr)}
.choice{
  background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:5px;transition:transform .12s, border-color .2s, box-shadow .2s;
}
.choice:hover:not(:disabled){transform:translateY(-3px);border-color:var(--hue,var(--ink));box-shadow:var(--shadow)}
.choice .ck{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.1rem;color:var(--hue,var(--ink))}
.choice .cs{font-size:.86rem;color:var(--muted);line-height:1.4}
.choice[data-state="right"]{border-color:var(--good);background:var(--good-fill)}
.choice[data-state="wrong"]{border-color:var(--oops);background:var(--oops-fill);animation:shake .4s}
.choice:disabled{cursor:default}
.choice .mini{width:100%;height:70px;background-size:contain;background-repeat:no-repeat;background-position:center bottom}

.verdict{border-radius:16px;padding:14px 16px;font-size:.96rem;border:2px solid;display:flex;flex-direction:column;gap:4px}
.verdict[data-v="right"]{background:var(--good-fill);border-color:var(--good)}
.verdict[data-v="wrong"]{background:var(--oops-fill);border-color:var(--oops)}
.verdict[data-v="note"]{background:var(--panel2);border-color:var(--line)}
.verdict strong{font-family:"Space Mono",monospace;font-size:.64rem;letter-spacing:.13em;text-transform:uppercase}
.verdict[data-v="right"] strong{color:var(--good)}
.verdict[data-v="wrong"] strong{color:var(--oops)}
.verdict[data-v="note"] strong{color:var(--muted)}

/* ---------- layer lab ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,318px);gap:18px;align-items:start}
.labstage{background:var(--panel);border:2px solid var(--line2);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.labstage svg{display:block;width:100%;height:auto}
.stack{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;gap:10px;border:2px solid var(--line2);border-radius:14px;padding:9px 12px;background:var(--panel);opacity:.38;transition:opacity .35s,border-color .35s}
.lrow[data-on]{opacity:1;border-color:var(--dl)}
.lrow .n{font-family:"Space Mono",monospace;font-size:.64rem;font-weight:700;color:var(--dl);flex:none;padding-top:3px;width:46px}
.lrow .t{font-size:.87rem;line-height:1.4}
.lrow .t b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}

/* ---------- map ---------- */
.mapwrap{
  position:relative;background:linear-gradient(180deg,var(--sky2),var(--panel));
  border:2px solid var(--line2);border-radius:26px;padding:6px;box-shadow:var(--shadow);overflow:hidden;
}
.mapwrap svg{display:block;width:100%;height:auto}
.station{cursor:pointer}
.station[data-locked]{cursor:not-allowed}
.levelcards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.lvcard{
  background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:15px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;transition:transform .14s,box-shadow .2s,border-color .2s;border-bottom-width:6px;
}
.lvcard:hover:not(:disabled){transform:translateY(-4px);box-shadow:var(--shadow)}
.lvcard[data-open]{border-color:var(--hue)}
.lvcard:disabled{opacity:.5;cursor:not-allowed}
.lvcard .lvn{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hue);font-weight:700}
.lvcard h3{font-size:1.15rem}
.lvcard p{font-size:.85rem;color:var(--muted);line-height:1.4}
.lvcard .st{font-family:"Space Mono",monospace;font-size:.63rem;color:var(--muted);margin-top:2px}

/* ---------- finale ---------- */
.scoreboard{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line2);border-radius:22px;padding:20px 24px;box-shadow:var(--shadow)}
.bignum{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:3.1rem;line-height:1;color:var(--joy);font-variant-numeric:tabular-nums}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.deffrow{display:flex;gap:13px;align-items:flex-start;border-left:5px solid var(--hue);background:var(--panel);border-radius:0 16px 16px 0;padding:13px 15px}
.deffrow .av{width:56px;height:60px;background-size:contain;background-repeat:no-repeat;background-position:center bottom;flex:none}
.deffrow h3{font-size:1.06rem;color:var(--hue)}
.deffrow p{font-size:.87rem;color:var(--muted);margin-top:2px}
.deffrow .tell{font-family:"Space Mono",monospace;font-size:.61rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin-top:6px;display:block}
.myths{display:flex;flex-direction:column;gap:9px}
.myth{border:2px solid var(--line2);border-radius:14px;padding:11px 14px;background:var(--panel)}
.myth q{font-weight:700;display:block;font-size:.94rem}
.myth p{font-size:.85rem;color:var(--muted);margin-top:3px}
.myth .no{color:var(--oops);font-weight:700;font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.11em;text-transform:uppercase}
.timeline{display:flex;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:14px}
.tl{flex:1 1 128px;padding-right:14px}
.tl b{display:block;font-family:"Space Mono",monospace;font-size:.94rem;color:var(--ai);font-variant-numeric:tabular-nums}
.tl span{font-size:.79rem;color:var(--muted);line-height:1.35;display:block}
.srcnote{font-size:.77rem;color:var(--muted);border-top:2px dashed var(--line);padding-top:13px}

@media (max-width:860px){
  :root{--band:44px;--radius:18px}
  .meet{grid-template-columns:repeat(2,1fr)}
  .lab{grid-template-columns:1fr}
  .sheet{grid-template-columns:1fr}
  .levelcards{grid-template-columns:1fr}
  .choices.four{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:580px){
  :root{--band:34px}
  .speak{grid-template-columns:1fr;justify-items:center}
  .puppet{width:150px}
  .rtag .av{display:none}
  .rtag{font-size:.55rem;letter-spacing:.06em}
  .rings{aspect-ratio:1/1}
  .choices{grid-template-columns:1fr}
  .bignum{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .btn:hover,.choice:hover,.meetcard:hover,.lvcard:hover{transform:none}
}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="shell">
  <header class="hud">
    <div class="brand"><span class="dot"></span>Ada&rsquo;s Nesting Boxes</div>
    <span class="chip" id="lvchip">The Journey</span>
    <span class="stars" id="stars" aria-label="levels cleared"></span>
    <span class="score" id="score">Score <b>0</b>/16</span>
    <button class="vbtn" id="vbtn" type="button" data-on>&#128266; Voices on</button>
  </header>
  <main class="view" id="stage"></main>
</div>

<script>
(function(){
"use strict";

/* =====================================================================

/* Build the mouth overlay for a character at a given openness (0, .5, 1).
   A radial-gradient patch hides the painted mouth so the drawn one can move. */
function mouthSVG(k, open){
  var m = MOUTH[k], id = "mg-"+k, s = "";
  s += '<defs><radialGradient id="'+id+'"><stop offset="0%" stop-color="'+m.face+'" stop-opacity="1"/>' +
       '<stop offset="88%" stop-color="'+m.face+'" stop-opacity="1"/>' +
       '<stop offset="100%" stop-color="'+m.face+'" stop-opacity="0"/></radialGradient></defs>';
  if(!m.noCover) s += '<ellipse cx="'+m.cx+'" cy="'+m.cy+'" rx="'+m.rx+'" ry="'+m.ry+'" fill="url(#'+id+')"/>';
  if(open <= 0.01){
    s += '<path d="'+m.smile+'" fill="none" stroke="'+m.ss+'" stroke-width="'+m.sw+'" stroke-linecap="round"/>';
    return s;
  }
  if(m.lip) s += '<ellipse cx="'+m.cx+'" cy="'+m.cy+'" rx="'+m.lr+'" ry="'+(m.lRy*open).toFixed(2)+'" fill="'+m.lip+'"/>';
  s += '<ellipse cx="'+m.cx+'" cy="'+m.cy+'" rx="'+m.ir+'" ry="'+(m.iry*open).toFixed(2)+'" fill="'+m.inner+'"/>';
  if(open > 0.55){
    var ty = m.cy + m.iry*open - m.tRy*open*0.9;
    s += '<ellipse cx="'+m.cx+'" cy="'+ty.toFixed(2)+'" rx="'+(m.tr*open).toFixed(2)+'" ry="'+(m.tRy*open).toFixed(2)+'" fill="'+m.tongue+'"/>';
  }
  return s;
}

var fx = document.getElementById("fx"), fctx = fx.getContext("2d"), bits = [], fxOn = false;
function sizeFx(){ fx.width = innerWidth*devicePixelRatio; fx.height = innerHeight*devicePixelRatio;
  fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
sizeFx(); addEventListener("resize", sizeFx);

var CONF = ["#E8459B","#E8760C","#0E8C82","#4356C9","#F2C230","#8E5BE8"];
function burst(x, y, n, power){
  if(reduce) return;
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, sp = (Math.random()*0.7+0.35)*power;
    bits.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - power*0.45,
      g:0.22+Math.random()*0.1, w:5+Math.random()*7, h:4+Math.random()*8,
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      c:CONF[(Math.random()*CONF.length)|0], life:1000+Math.random()*750, t:0});
  }
  if(!fxOn){ fxOn = true; requestAnimationFrame(tickFx); }
}
function burstAt(node, n, power){
  if(!node) return;
  var r = node.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, n||26, power||9);
}
var lastFx = 0;
function tickFx(ts){
  var dt = lastFx ? Math.min(64, ts - lastFx) : 16.7;
  lastFx = ts;
  var f = dt/16.7;
  fctx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=bits.length-1;i>=0;i--){
    var b = bits[i];
    b.t += dt; b.vy += b.g*f; b.x += b.vx*f; b.y += b.vy*f; b.r += b.vr*f;
    if(b.t > b.life || b.y > innerHeight+40){ bits.splice(i,1); continue; }
    fctx.save(); fctx.translate(b.x,b.y); fctx.rotate(b.r);
    fctx.globalAlpha = Math.max(0, 1 - b.t/b.life);
    fctx.fillStyle = b.c; fctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); fctx.restore();
  }
  if(bits.length){ requestAnimationFrame(tickFx); }
  else { fxOn = false; lastFx = 0; fctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* Strip markup so the voice reads clean text. */
function plain(html){
  var d = document.createElement("div"); d.innerHTML = html;
  return (d.textContent || "").replace(/\s+/g," ").trim();
}

function talk(speakEl, k, html, done){
  stopTalk();
  var pup = speakEl.__puppet, bub = speakEl.__bubble;
  curPuppet = pup; onDone = done || null;
  pup.setAttribute("data-talking","");
  bub.innerHTML = "";

  var txt = el("span"), caret = el("span","caret");
  bub.appendChild(txt); bub.appendChild(caret);

  /* type the visible characters, keeping any inline tags intact */
  var tokens = html.match(/<[^>]+>|&[a-z]+;|[\s\S]/g) || [];
  var i = 0, out = "";
  var speed = reduce ? 0 : 16;

  function finish(){
    clearInterval(typeT); clearInterval(mouthT); typeT = mouthT = null;
    txt.innerHTML = html; if(caret.parentNode) caret.remove();
    pup.removeAttribute("data-talking");
    pup.querySelector(".mouth").innerHTML = mouthSVG(k, 0);
    if(onDone) onDone();
  }
  if(speed === 0){ finish(); }
  else {
    typeT = setInterval(function(){
      var step = 2;
      while(step-- > 0 && i < tokens.length){ out += tokens[i++]; }
      txt.innerHTML = out;
      if(i >= tokens.length) finish();
    }, speed);
    var mo = pup.querySelector(".mouth"), frames = [1,0.5,1,0.35,1,0.5,0,0.5];
    var fi = 0;
    mouthT = setInterval(function(){
      mo.innerHTML = mouthSVG(k, frames[fi++ % frames.length]);
    }, 105);
  }

  if(S.voice && window.speechSynthesis){
    try{
      var u = new SpeechSynthesisUtterance(plain(html));
      u.pitch = CAST[k].pitch; u.rate = CAST[k].rate; u.volume = 0.95;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  bub.title = "Tap to skip ahead";
  bub.addEventListener("click", function(){
    if(typeT){ finish(); if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(e){} }
  });
  return speakEl;
}

var trailPath = null, stationLen = [], tokEl = null, tokBody = null;
function measureTrail(svgRoot){
  trailPath = svgRoot.querySelector("#trail");
  var total = trailPath.getTotalLength();
  stationLen = STATIONS.map(function(st){
    var bestL = 0, bestD = 1e9;
    for(var l=0; l<=total; l+=2){
      var p = trailPath.getPointAtLength(l);
      var d = (p.x-st.x)*(p.x-st.x) + (p.y-st.y)*(p.y-st.y);
      if(d < bestD){ bestD = d; bestL = l; }
    }
    return bestL;
  });
  tokEl = svgRoot.querySelector("#tok");
  tokBody = svgRoot.querySelector("#tokBody");
}
function placeToken(i){
  if(!trailPath) return;
  var p = trailPath.getPointAtLength(stationLen[i]);
  tokEl.setAttribute("transform","translate("+p.x+","+(p.y+6)+")");
  tokBody.setAttribute("transform","scale(1,1)");
}
/* three little arcs from one station to the next, with squash and stretch */
function hop(from, to, done){
  if(!trailPath || reduce){ placeToken(to); if(done) done(); return; }
  var a = stationLen[from], b = stationLen[to], arcs = 3, arc = 0, t0 = null;
  var DUR = 460;
  function frame(ts){
    if(t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0)/DUR);
    var seg0 = a + (b-a)*(arc/arcs), seg1 = a + (b-a)*((arc+1)/arcs);
    var len = seg0 + (seg1-seg0)*p;
    var pt = trailPath.getPointAtLength(len);
    var lift = Math.sin(Math.PI*p) * 42;
    var sy = 1 + 0.20*Math.sin(Math.PI*p), sx = 1 - 0.15*Math.sin(Math.PI*p);
    if(p < 0.10 || p > 0.90){ sy = 0.80; sx = 1.20; }
    tokEl.setAttribute("transform","translate("+pt.x+","+(pt.y+6-lift)+")");
    tokBody.setAttribute("transform","scale("+sx.toFixed(3)+","+sy.toFixed(3)+")");
    if(p < 1){ requestAnimationFrame(frame); }
    else {
      puff(pt.x, pt.y+6);
      arc++;
      if(arc < arcs){ t0 = null; requestAnimationFrame(frame); }
      else { tokBody.setAttribute("transform","scale(1,1)"); if(done) done(); }
    }
  }
  requestAnimationFrame(frame);
}
function puff(x,y){
  var svg = document.querySelector(".mapwrap svg"); if(!svg) return;
  for(var i=0;i<4;i++){
    (function(i){
      var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",3);
      c.setAttribute("fill","var(--muted)"); c.setAttribute("opacity",".5");
      svg.appendChild(c);
      var dx = (i-1.5)*9, t0 = null;
      function f(ts){
        if(t0===null) t0=ts;
        var p = Math.min(1,(ts-t0)/340);
        c.setAttribute("cx", x + dx*p); c.setAttribute("cy", y - 5*p);
        c.setAttribute("r", 3 + 5*p); c.setAttribute("opacity", (0.5*(1-p)).toFixed(2));
        if(p<1) requestAnimationFrame(f); else c.remove();
      }
      requestAnimationFrame(f);
    })(i);
  }
}

function levelBeats(l){
  if(l === 0) return [{t:"meet"}].concat(WHO.map(function(w,i){ return {t:"who", i:i}; }));
  if(l === 1) return [{t:"fork"},{t:"lab"}].concat(SORT_EASY.map(function(c,i){ return {t:"sort", set:"easy", i:i}; }));
  return JM.map(function(c,i){ return {t:"jm", i:i}; }).concat(SORT_HARD.map(function(c,i){ return {t:"sort", set:"hard", i:i}; }));
}
function startLevel(l){
  S.level = l; S.beat = 0; S.view = "level"; S.answered = false; S.node = l + 1;
  S.layer = 0; S.forkSeen = {}; S.heard = {};
  S.levelScore = 0;
  renderBeat();
}
function nextBeat(){
  S.answered = false;
  S.beat++;
  var beats = levelBeats(S.level);
  if(S.beat >= beats.length) return finishLevel();
  renderBeat();
}
function finishLevel(){
  stopTalk();
  var L = LEVELS[S.level];
  var was = S.cleared[S.level];
  S.cleared[S.level] = true;
  S.best[S.level] = Math.max(S.best[S.level], S.levelScore);
  S.view = "level"; paintHud();

  stage.innerHTML = "";
  stage.appendChild(el("span","eyebrow","Level cleared"));
  stage.appendChild(el("h1","title", S.levelScore === L.pts ? "Perfect run!" : "Level cleared!"));

  var host = L.host;
  var sp = buildSpeak(host);
  stage.appendChild(sp);
  var line = S.levelScore === L.pts
    ? "Every single one. That was a clean sweep &mdash; off you hop to the next one."
    : "You got " + S.levelScore + " out of " + L.pts + ". The ones you missed are the ones that stick hardest, so that&rsquo;s no bad thing at all.";
  talk(sp, host, line);

  var sb = el("div","scoreboard");
  sb.appendChild(el("div","bignum", S.levelScore + "/" + L.pts));
  var side = el("div");
  side.appendChild(el("h2","title", L.t));
  side.appendChild(el("p","lede", S.level < 2 ? "Next stop: " + plain(LEVELS[S.level+1].t) + "." : "That was the last level. Time for your cheat sheet."));
  sb.appendChild(side);
  stage.appendChild(sb);

  var row = el("div","row");
  row.appendChild(btn("Hop to the map &rarr;","btn joy", function(){
    var from = S.level + 1, to = S.level + 2;
    S.node = to;
    viewMap();
    setTimeout(function(){
      placeToken(from);
      hop(from, to, function(){
        var mw = document.querySelector(".mapwrap");
        if(mw){ var r = mw.getBoundingClientRect();
          burst(r.left + r.width*(STATIONS[to].x/900), r.top + r.height*(STATIONS[to].y/330), 40, 11); }
      });
    }, 60);
  }));
  stage.appendChild(row);

  setTimeout(function(){ burstAt(document.querySelector(".scoreboard"), 60, 12); }, 250);
  if(!was) paintHud();
  scrollTop();
}

function award(ok, node){
  if(ok){ S.score++; S.levelScore++; burstAt(node, 24, 8); }
  paintHud();
}

function renderBeat(){
  stopTalk(); paintHud();

function beatFork(){
  stage.appendChild(el("h2","title","Teach a computer to spot a cat."));

  ["rules","learn"].forEach(function(key){

function doFork(key, ch, out){
  var f = FORK[key];
  S.forkSeen[key] = true;
  Array.prototype.forEach.call(ch.children, function(n, i){
    var kk = (i === 0 ? "rules" : "learn");
    n.disabled = true;
    n.setAttribute("data-state", kk === key ? "right" : "");
    if(kk !== key) n.style.opacity = ".45";
  });
  out.innerHTML = "";
  var v = el("div","verdict"); v.setAttribute("data-v","note");
  v.appendChild(el("strong", null, f.head));
  v.appendChild(el("p", null, f.body));
  v.appendChild(el("p", null, "<b>" + f.tag + "</b>"));
  out.appendChild(v);

  var rings = buildRings(false, function(){}, null);
  ORDER.forEach(function(o){ if(o !== f.box) ringOf(rings,o).setAttribute("data-dim",""); });
  out.appendChild(rings);

  var sp = buildSpeak(f.box);
  out.appendChild(sp);
  talk(sp, f.box, f.say);

  var both = S.forkSeen.rules && S.forkSeen.learn;
  var row = el("div","row");

    var other = (key === "rules" ? "learn" : "rules");
    row.appendChild(btn("Now try: " + FORK[other].ck, "btn ghost", function(){
      Array.prototype.forEach.call(ch.children, function(n){ n.disabled = false; n.style.opacity = ""; n.removeAttribute("data-state"); });
      doFork(other, ch, out);
    }));
  } else {
    out.appendChild(el("div","verdict","<strong>The point</strong><p>Both of those are artificial intelligence. Only the second one is machine learning. For its first thirty years the field was mostly hand-written rules &mdash; useful, clever, and completely unable to learn a thing.</p>"));
  }
  row.appendChild(btn("Next: what &ldquo;deep&rdquo; means &rarr;","btn joy", nextBeat));
  out.appendChild(row);
}
